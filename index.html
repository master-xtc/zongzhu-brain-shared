:root{color-scheme:dark;--bg:#0A0A0F;--card:#15151F;--line:#2A2A3A;--gold:#C9A96A;--text:#E8E6DF;--muted:#9A968C;--red:#D97A6B}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#171723 0%,var(--bg) 58%);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;display:grid;place-items:center;padding:24px}

input{width:100%;background:#0D0D15;border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--text);font-size:15px;outline:none}
input:focus{border-color:var(--gold)}
button{margin-top:14px;width:100%;border:0;border-radius:8px;padding:12px 16px;background:linear-gradient(180deg,var(--gold),#a98a4e);color:#0A0A0F;font-weight:700;font-size:14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;color:var(--red);font-size:12px;margin-top:10px}
.foot{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:11px;line-height:1.7}
</style>

const b64=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const form=document.getElementById("gate"),pw=document.getElementById("pw"),btn=document.getElementById("btn"),err=document.getElementById("err");
async function unlock(value){
  err.textContent="";
  btn.disabled=true; btn.textContent="正在解锁...";
  try{
    const enc=new TextEncoder();
    const base=await crypto.subtle.importKey("raw",enc.encode(value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(DATA.salt),iterations:DATA.iterations,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATA.iv)},key,b64(DATA.cipher));
    const html=new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(e){
    err.textContent="密钥不正确，或文件已损坏。";
    btn.disabled=false; btn.textContent="解锁";
    pw.select();
  }
}
form.addEventListener("submit",(e)=>{e.preventDefault(); const v=pw.value.trim(); if(!v){err.textContent="请输入密钥。";return;} unlock(v);});
